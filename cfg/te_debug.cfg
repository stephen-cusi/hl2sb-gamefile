// HL2SB: temp-entity delivery diagnostic.
//
// CBaseServer::WriteTempEntities() (engine/baseserver.cpp) prints
//     TE <send table name> full bits: <n>
// for every temp entity it actually writes into the local client's packet --
// but only through DevMsg, which needs developer 1.
//
// Use it to settle whether a missing effect (e.g. the env_explosion the weagon
// makes) is lost on the server side or on the client side:
//   * "TE DT_TEExplosion full bits: ..." appears  -> server wrote it, the client
//     dropped/ignored it.
//   * no such line at all                          -> the server never wrote it.
//
// developer 1 is loud, so turn it back off with `exec te_debug_off` when done.

developer 1
sv_debugtempentities 1
echo "=============================================="
echo "[TEDBG] on. Fire the weagon secondary a few times,"
echo "[TEDBG] then run:  exec te_debug_off"
echo "=============================================="

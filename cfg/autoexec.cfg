exec config_hl2sb.cfg
// ds debug: log full console (incl client Lua errors) to ds_debug.log
con_logfile "ds_debug.log"
fps_max "90"

// HL2SB Context Menu - hold C to open (configurable via hl2sb_context_key)
// Default key is C (key code 67). Change with: hl2sb_context_key <keycode>
exec hl2sb_config.cfg

// HL2SB Undo - Z key undoes this player's last spawn action.
// Undo is Garry's Mod's Lua module (lua/includes/modules/undo.lua); the command
// is GMod's own `undo` (aliases: gmod_undo, gmod_undonum). The old
// hl2sb_undo command lived in the C++ stack, which no longer exists.
bind "z" "undo"

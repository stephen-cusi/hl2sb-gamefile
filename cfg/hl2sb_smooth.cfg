// HL2SB: make a MULTIPLAYER listen server's LOCAL player feel like single player.
//
// Why this exists: maxclients 1 and >= 2 flip the engine between two networking
// modes, and the local (loopback) player is affected even though nothing leaves
// the machine.  Evidence lives in AGENTS.md section 17:
//   * single player sends a datagram EVERY frame, multiplayer rate-limits the
//     loopback client by cl_updaterate   (engine/baseclient.cpp:1378-1395)
//   * single player runs prediction on the zero-latency schedule, multiplayer
//     re-runs it every frame                (engine/cl_ents_parse.cpp:707-722)
//   * single player pins m_nTickBase to the server tick, multiplayer pushes it
//     sv_clockcorrection_msecs (default 60 ms) into the future
//                                          (game/server/player.cpp:3145-3157)
//
// Usage: load a map in multiplayer, then in the console:   exec hl2sb_smooth
// Everything here is reversible: just reload the map / restart the game, or run
// exec config_hl2sb if that is what your config chain uses.
//
// NOTE sv_minupdaterate is the only line that affects OTHER clients.  On a real
// internet server that is bandwidth you do not want to pay, so raise it back to
// 20-30 before hosting for strangers; on a LAN/listen server it is free.

sv_maxupdaterate 100
sv_minupdaterate 66
cl_updaterate 100
cl_cmdrate 100

// The big one for the local player: stop pushing the tickbase 60 ms into the
// future.  A loopback connection has no latency to correct.
sv_clockcorrection_msecs 0

// Minimal interpolation, but NOT zero: with cl_interp 0 / ratio 1 the client gets
// a snapshot every 10 ms while it renders every ~11 ms, so the interpolation
// buffer starves and the local player's model STOPS updating (this is exactly
// what happened the first time this file was used - "动作消失了").
// 0.03 s is the classic safe floor (2 ticks at 66 tick); ratio 1 keeps it there.
cl_interp 0.03
cl_interp_ratio 1
cl_interpolate 1

// Keep the loopback connection unthrottled (this is the 0 default, restated so
// the experiment is explicit).
host_limitlocal 0

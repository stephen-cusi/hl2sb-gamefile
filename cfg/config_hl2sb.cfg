toolmode "0"
// HL2SB 2026-09-13: Q now opens the GARRY'S MOD spawnmenu -- the Lua/Derma one in
// gamemodes/sandbox/gamemode/spawnmenu/.
//
// +menu / -menu are NOT engine commands: gamemodes/base/gamemode/cl_spawnmenu.lua
// registers them with concommand.Add, and pressing Q runs +menu ->
// hook.Run("OnSpawnMenuOpen") -> GM:OnSpawnMenuOpen, which opens g_SpawnMenu.
//
// The previous binding was the fork's own C++ panel:  bind "q" "+smenu"
// That one still exists; it is just no longer on a key.  Type `+smenu` / `-smenu`
// in the console, or `bind q +smenu` to put it back.
bind "q" "+menu"
bind "t" "sm_legacy_menu 1"
bind "x" "noclip"
//hud_fastswitch "1"
sm_wide "127"
sm_height "127"
sm_legacy_wide "100"
sm_legacy_height "40"
sv_allow_noclip "1"
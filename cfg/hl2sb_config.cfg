// hl2sb_config.cfg
// HL2SB in-game context menu (hold C) — default values.
// Loaded automatically from autoexec.cfg.  Edit and re-exec to tune.
//
// All values are read live, so changes apply the next time the menu opens
// (or immediately for the wheel / drag speeds).

// ---------------------------------------------------------------- window
// Menu window size in pixels.
hl2sb_ctx_window_width    "1200"
hl2sb_ctx_window_height   "800"

// Left model-list width as a fraction of the window (0.30 - 0.60).
hl2sb_ctx_list_ratio      "0.44"

// Animation list height as a fraction of the right column (0.20 - 0.50).
hl2sb_ctx_anim_ratio      "0.34"

// ---------------------------------------------------------------- preview
// Preview camera field of view, in degrees.  Lower = more zoomed / flatter.
hl2sb_ctx_fov             "54"

// How much empty space to leave around the model when auto-fitting.
//   1.0 = tight (upper body fills the frame)
//   1.6 = full body with padding
hl2sb_ctx_fit_padding     "1.0"

// Starting zoom multiplier applied on top of the fitted distance.
// Smaller = camera closer to the model.
hl2sb_ctx_default_zoom    "1.0"

// How much one mouse-wheel notch changes the zoom.
hl2sb_ctx_wheel_step      "0.08"

// Zoom clamp range (min / max).
hl2sb_ctx_zoom_min        "0.25"
hl2sb_ctx_zoom_max        "4.0"

// Degrees of model yaw per pixel of horizontal drag.
hl2sb_ctx_rotate_speed    "0.5"

// ---------------------------------------------------------------- animation
// Preferred default animation played when a model is previewed.
// Tried as an exact sequence name first; then any sequence containing
// "walk"/"run", then "idle", then sequence 0.
hl2sb_ctx_default_anim    "walk"

// ---------------------------------------------------------------- list text
// SectionedListPanel text colour (R G B A) — hl2sb's scheme makes it orange,
// this keeps the neutral Source look.
hl2sb_ctx_text_r          "220"
hl2sb_ctx_text_g          "220"
hl2sb_ctx_text_b          "220"
